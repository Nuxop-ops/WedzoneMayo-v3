function total(o){return o.items.reduce((a,i)=>a+(Number(i.weight)||0)*(i.price??prod(i.product)?.price??0),0)}
function navigate(p){page=p;query='';render()}
function badge(o){return '<span class="badge '+(o.status==='done'?'green':o.status==='progress'?'blue':'')+'"><span class="status-dot">●</span>'+(o.status==='done'?'Zrealizowane':o.status==='progress'?'W realizacji':'Nowe / Zamówione')+'</span>'}
function rows(list){return list.length?'<div class="table-wrap"><table><thead><tr><th>Zamówienie</th><th>Klient</th><th>Dostawa</th><th>Status</th><th>Płatność</th><th>Wartość po ważeniu</th><th></th></tr></thead><tbody>'+list.map(o=>'<tr><td><strong class="id">#WM-'+o.number+'</strong><small>'+esc(o.date)+'</small></td><td><strong>'+esc(client(o.client)?.name||'Usunięty klient')+'</strong><small>'+o.items.length+' produkty</small></td><td>'+esc(o.method)+'</td><td>'+badge(o)+'</td><td><span class="badge '+(o.paid?'green':'gray')+'">'+(o.paid?'Zapłacone':'Oczekuje')+'</span></td><td>'+(o.items.every(i=>Number(i.weight)>0)?money(total(o)):'<span class="muted">Do ustalenia</span>')+'</td><td><button class="quiet" onclick="openOrder(\''+o.id+'\')">Otwórz ↗</button></td></tr>').join('')+'</tbody></table></div>':'<div class="empty">Brak zamówień do wyświetlenia.</div>'}

function goOrders(s='new',m='Wszystkie'){status=s;method=m;navigate('orders')}


function render(){const nav=[['dashboard','home','Pulpit'],['orders','cart','Zamówienia'],['clients','users','Klienci'],['delivery','truck','Dowóz'],['labels','tag','Etykiety'],['products','box','Produkty'],['settings','settings','Ustawienia']];$('#app').innerHTML='<div class="app"><aside><button class="brand brand-button" onclick="navigate(\'dashboard\')" aria-label="Wędzone Mayo — pulpit">'+icon('flame','brand-flame')+'<strong>WĘDZONE<br>MAYO</strong></button><nav aria-label="Menu główne">'+nav.map(([p,i,t])=>'<button class="'+(page===p?'active':'')+'" onclick="navigate(\''+p+'\')">'+icon(i)+'<span>'+t+'</span>'+(p==='orders'?'<small class="nav-count">'+db.orders.filter(o=>o.status!=='done').length+'</small>':'')+'</button>').join('')+'</nav><div class="side-foot"><span class="dot">●</span> Twoja pracownia<br><small>Z pasji do dobrego smaku</small></div></aside><div class="workspace"><header><span>Wędzone Mayo <span style="padding:0 12px;color:#555">/</span> '+nav.find(n=>n[0]===page)[2]+'</span><div class="profile"><span>'+new Date().toLocaleDateString('pl-PL',{day:'numeric',month:'long',year:'numeric'})+'</span><button class="avatar" onclick="navigate(\'settings\')" aria-label="Ustawienia pracowni">'+icon('user')+'</button></div></header><main id="main"></main></div></div>';({dashboard,orders,products,clients,labels,settings,delivery}[page])()}
function dashboard(){
 const count=(s,m)=>db.orders.filter(o=>(!s||o.status===s)&&(!m||o.method===m)).length;
 const unpaid=db.orders.filter(o=>!o.paid&&o.status!=='done').length;
 const metrics=[['cart',db.orders.length,'Wszystkie zamówienia',"goOrders('new')"],['truck',db.orders.filter(o=>o.method==='Dowóz'&&o.status!=='done').length,'Do dowozu',"navigate('delivery')"],['wallet',unpaid,'Do zapłaty',"showUnpaid()"],['check',count('done'),'Zrealizowane',"goOrders('done')"]];
 const flow=(m,i)=>'<section class="flow-card '+(m==='Poczta'?'postal':'courier')+'"><div class="flow-title">'+icon(i)+'<h2>Zamówienia · '+m+'</h2></div><div class="flow-steps">'+[['new','cart','Nowe'],['progress',m==='Poczta'?'scale':'truck',m==='Poczta'?'W realizacji':'Dowóz'],['done','check','Zrealizowane']].map(([s,ic,t],n)=>'<button class="flow-step '+(s==='progress'?'selected':'')+'" onclick="goOrders(\''+s+'\',\''+m+'\')">'+icon(ic)+'<b class="count-bubble '+(s==='done'?'green':'')+'">'+count(s,m)+'</b><span>'+t+'</span></button>'+(n<2?'<span class="flow-arrow" aria-hidden="true">→</span>':'')).join('')+'</div></section>';
 $('#main').innerHTML='<div class="dashboard"><section class="hero"><div class="hero-shade"></div><div class="hero-tools"><button aria-label="Szukaj zamówienia" onclick="goOrders(\'new\');document.getElementById(\'search\').focus()">'+icon('search')+'</button><button aria-label="Ustawienia pracowni" onclick="navigate(\'settings\')">'+icon('user')+'</button></div><div class="hero-brand">'+icon('flame','hero-flame')+'<h1>WĘDZONE MAYO</h1><div class="brand-rule"><span>◆</span></div><p>PRAWDZIWE WĘDZONKI</p><em>z pasją</em></div></section><div class="stats">'+metrics.map(([ic,n,t,action])=>'<button class="stat metric '+(ic==='check'?'complete':'')+'" onclick="'+action+'">'+icon(ic)+'<div><b>'+n+'</b><span>'+t+'</span></div></button>').join('')+'</div><div class="flows">'+flow('Poczta','mail')+flow('Dowóz','truck')+'</div><section class="panel recent"><div class="panel-head"><h2>Ostatnie zamówienia</h2><button class="quiet gold-link" onclick="goOrders(\'new\')">Zobacz wszystkie →</button></div>'+dashboardRows([...db.orders].reverse().slice(0,5))+'</section><div class="quick-actions">'+[['plus','Nowe zamówienie','newOrder()'],['truck','Plan dowozu',"navigate('delivery')"],['tag','Etykiety A4',"navigate('labels')"],['box','Produkty',"navigate('products')"],['users','Klienci',"navigate('clients')"]].map(([ic,t,a])=>'<button onclick="'+a+'">'+icon(ic)+'<span>'+t+'</span></button>').join('')+'</div><div class="bottom-note"><span>WĘDZONE MAYO · Prawdziwe wędzonki z pasją</span><span>Dane zapisane w tej przeglądarce</span></div></div>';
}
function dashboardRows(list){return '<div class="table-wrap"><table><thead><tr><th>Klient</th><th>Dostawa</th><th>Status</th><th>Kwota</th><th>Termin</th><th></th></tr></thead><tbody>'+list.map(o=>'<tr><td><span class="customer-cell"><span class="customer-icon">'+icon('user')+'</span><strong>'+esc(client(o.client)?.name)+'</strong></span></td><td><span class="delivery-cell">'+icon(o.method==='Poczta'?'mail':'truck')+esc(o.method)+'</span></td><td>'+badge(o)+'</td><td>'+(o.items.every(i=>Number(i.weight)>0)?money(total(o)):'<small>Do zważenia</small>')+'</td><td>'+esc(o.date)+'</td><td><button class="quiet" onclick="openOrder(\''+o.id+'\')">Otwórz ↗</button></td></tr>').join('')+'</tbody></table></div>'}
function showUnpaid(){showModal(modalHead('Zamówienia do zapłaty','Nieopłacone zamówienia oczekujące na realizację.')+rows(db.orders.filter(o=>!o.paid&&o.status!=='done')),true)}
function delivery(){const list=db.orders.filter(o=>o.method==='Dowóz'&&o.status!=='done').sort((a,b)=>a.date.localeCompare(b.date));$('#main').innerHTML=heading('Plan dowozu','Adresy, terminy i zamówienia do dostarczenia.','<button class="primary" onclick="newOrder()">＋ Nowe zamówienie</button>')+'<div class="grid">'+list.map(o=>{const c=client(o.client);return '<section class="panel delivery-card"><div class="row">'+icon('truck')+badge(o)+'</div><h2>'+esc(c?.name)+'</h2><p>'+esc(c?.address)+'</p><p class="tip">'+esc(c?.phone)+'<br>Termin: '+esc(o.date)+'</p><button class="primary" onclick="openOrder(\''+o.id+'\')">Otwórz zamówienie #'+o.number+'</button></section>'}).join('')+(list.length?'':'<div class="empty">Brak zamówień do dowozu.</div>')+'</div>'}
function orders(){const list=db.orders.filter(o=>o.status===status&&(method==='Wszystkie'||o.method===method)&&[o.number,client(o.client)?.name,client(o.client)?.phone].join(' ').toLowerCase().includes(query.toLowerCase()));$('#main').innerHTML=heading('Zamówienia','Od zamówienia do gotowej paczki. Wszystko pod kontrolą.','<button class="primary" onclick="newOrder()">＋ Nowe zamówienie</button>')+'<div class="tabs">'+[['new','Nowe / Zamówione'],['progress','W realizacji'],['done','Zrealizowane']].map(([s,t])=>'<button class="'+(s===status?'active':'')+'" onclick="status=\''+s+'\';orders()">'+t+' <small> '+db.orders.filter(o=>o.status===s).length+'</small></button>').join('')+'</div><div class="toolbar"><input id="search" aria-label="Szukaj zamówień" placeholder="Szukaj klienta, numeru lub telefonu…" value="'+esc(query)+'"><div class="filters">'+['Wszystkie','Poczta','Dowóz'].map(m=>'<button class="'+(m===method?'active':'')+'" onclick="method=\''+m+'\';orders()">'+m+'</button>').join('')+'</div></div><div class="panel" id="order-results">'+rows(list)+'</div><div class="bottom-note"><span>'+list.length+' zamówienia w tym widoku</span><span>Wartość jest obliczana po wpisaniu rzeczywistej wagi.</span></div>';$('#search').oninput=e=>{query=e.target.value;const l=db.orders.filter(o=>o.status===status&&(method==='Wszystkie'||o.method===method)&&[o.number,client(o.client)?.name,client(o.client)?.phone].join(' ').toLowerCase().includes(query.toLowerCase()));$('#order-results').innerHTML=rows(l)}}
function showModal(html,wide=false){$('#modal').innerHTML='<div class="modal-backdrop"><section class="modal '+(wide?'wide':'')+'" role="dialog" aria-modal="true" aria-label="Karta edycji">'+html+'</section></div>';$('#modal').querySelector('button,input,select')?.focus()}
function closeModal(){editing=null;draft=null;$('#modal').innerHTML=''}
function modalHead(title,sub=''){return '<div class="modal-head"><div><span class="eyebrow">Wędzone Mayo</span><h2>'+title+'</h2><span class="muted">'+sub+'</span></div><button aria-label="Zamknij" onclick="closeModal()">✕</button></div>'}
function units(p){return p?.sausage?['pętka','kg']:['szt.','kg']}
function newOrder(){if(!db.clients.length||!db.products.length){alertBox('Dodaj dane','Najpierw dodaj klienta i produkt.');return}draft={id:uid(),number:Math.max(1000,...db.orders.map(o=>o.number))+1,client:db.clients[0].id,method:'Poczta',status:'new',paid:false,date:today(),items:[{product:db.products[0].id,qty:1,unit:units(db.products[0])[0],weight:''}],notes:''};orderForm()}
function orderForm(){showModal(modalHead('Nowe zamówienie','Wybierz produkty, ilości i sposób dostawy.')+'<form id="new-order"><div class="form-grid"><label>Klient<select id="oc">'+db.clients.map(c=>'<option value="'+c.id+'" '+(draft.client===c.id?'selected':'')+'>'+esc(c.name)+'</option>').join('')+'</select></label><label>Sposób dostawy<select id="om">'+['Poczta','Dowóz'].map(m=>'<option '+(draft.method===m?'selected':'')+'>'+m+'</option>').join('')+'</select></label><label>Termin realizacji<input id="od" type="date" required value="'+esc(draft.date)+'"></label><label class="check"><input id="op" type="checkbox" '+(draft.paid?'checked':'')+'> Zapłacone</label></div><div class="section"><h3>Produkty w zamówieniu</h3><div id="lines">'+draft.items.map((i,n)=>'<div class="order-line"><select aria-label="Produkt" onchange="changeDraftProduct('+n+',this.value)">'+db.products.map(p=>'<option value="'+p.id+'" '+(i.product===p.id?'selected':'')+'>'+esc(p.name)+'</option>').join('')+'</select><input aria-label="Ilość" type="number" min="0.01" step="0.01" required value="'+i.qty+'" onchange="draft.items['+n+'].qty=Number(this.value)"><select aria-label="Jednostka" onchange="draft.items['+n+'].unit=this.value">'+units(prod(i.product)).map(u=>'<option '+(i.unit===u?'selected':'')+'>'+u+'</option>').join('')+'</select><button type="button" aria-label="Usuń pozycję" onclick="captureDraft();draft.items.splice('+n+',1);orderForm()">×</button></div>').join('')+'</div><button type="button" onclick="captureDraft();draft.items.push({product:db.products[0].id,qty:1,unit:units(db.products[0])[0],weight:\'\'});orderForm()">＋ Dodaj produkt</button><p class="tip" style="margin-top:16px">Kiełbasa: pętka lub kg. Pozostałe produkty: sztuki lub kg.<br>Rzeczywistą wagę wpiszesz podczas realizacji.</p></div><label class="section">Uwagi<textarea id="on" rows="3">'+esc(draft.notes)+'</textarea></label><div class="modal-actions"><button type="button" onclick="closeModal()">Anuluj</button><button class="primary">Zapisz zamówienie</button></div></form>');$('#new-order').onsubmit=e=>{e.preventDefault();captureDraft();if(!draft.items.length||draft.items.some(i=>!Number.isFinite(i.qty)||i.qty<=0)){alertBox('Sprawdź produkty','Dodaj co najmniej jeden produkt z ilością większą od zera.');return}draft.items.forEach(i=>i.price=prod(i.product).price);db.orders.push(draft);save();closeModal();render();toast('Zamówienie zostało dodane')}}
function captureDraft(){if(!draft)return;draft.client=$('#oc').value;draft.method=$('#om').value;draft.date=$('#od').value;draft.paid=$('#op').checked;draft.notes=$('#on').value}
function changeDraftProduct(n,id){captureDraft();draft.items[n].product=id;draft.items[n].unit=units(prod(id))[0];orderForm()}
function openOrder(id){const o=db.orders.find(o=>o.id===id);editing=id;const c=client(o.client);const locked=o.method==='Poczta'&&!o.paid;showModal(modalHead('Zamówienie #WM-'+o.number,esc(c?.name)+' · '+esc(o.method)+' · '+esc(o.date))+'<div class="row">'+badge(o)+'<span class="muted">'+esc(c?.phone)+'</span></div><p class="tip" style="margin-top:16px">'+esc(c?.address)+'</p><label class="check section"><input type="checkbox" '+(o.paid?'checked':'')+' onchange="setPaid(\''+id+'\',this.checked)"> <strong>Zapłacone</strong></label>'+(locked?'<div class="notice" style="margin-top:18px">Przesyłka pocztowa wymaga płatności przed ważeniem.</div>':'')+'<div class="section"><h3>Ważenie i realizacja</h3><p class="tip">Wpisz rzeczywistą wagę każdej pozycji. Cena jest liczona za kilogram.</p>'+o.items.map((i,n)=>'<div class="weight-row"><div><strong>'+esc(prod(i.product)?.name)+'</strong><small>Zamówiono: '+i.qty+' '+esc(i.unit)+' · '+money(i.price??prod(i.product)?.price)+'/kg</small></div><label>Waga (kg)<input aria-label="Waga '+esc(prod(i.product)?.name)+'" type="number" min="0.001" step="0.001" value="'+esc(i.weight)+'" '+(o.status==='done'?'disabled':'')+' onfocus="guardWeight(this,\''+id+'\')" onchange="setWeight(\''+id+'\','+n+',this)"></label><strong id="line-total-'+n+'">'+money(Number(i.weight)*(i.price??prod(i.product)?.price??0))+'</strong></div>').join('')+'<div class="total"><span>Razem po zważeniu</span><b id="order-total">'+money(total(o))+'</b></div></div>'+(o.notes?'<div class="section"><h3>Uwagi do zamówienia</h3><p class="tip">'+esc(o.notes)+'</p></div>':'')+'<div class="modal-actions"><button onclick="closeModal()">Zamknij</button>'+(o.status==='new'?'<button onclick="startOrder(\''+id+'\')">Rozpocznij realizację</button>':'')+(o.status!=='done'?'<button class="primary" onclick="completeOrder(\''+id+'\')">Zatwierdź i dodaj etykiety →</button>':'<button class="primary" onclick="addOrderLabels(\''+id+'\');closeModal();navigate(\'labels\')">Dodaj etykiety ponownie</button>')+'</div>',true)}
function setPaid(id,v){const o=db.orders.find(x=>x.id===id);if(o.status==='done'&&o.method==='Poczta'&&!v){alertBox('Zrealizowana przesyłka','Nie można cofnąć płatności zrealizowanego zamówienia pocztowego.');openOrder(id);return}o.paid=v;save();openOrder(id);render()}
function guardWeight(input,id){const o=db.orders.find(x=>x.id===id);if(o.method==='Poczta'&&!o.paid){input.blur();alertBox('Najpierw zaznacz „Zapłacone”','Zamówienie wysyłane pocztą musi być opłacone przed ważeniem. Zaznacz „Zapłacone” w tej karcie, a następnie wpisz rzeczywistą wagę produktów.');return false}return true}
function setWeight(id,n,input){const o=db.orders.find(x=>x.id===id);if(!guardWeight(input,id)){input.value=o.items[n].weight;return}const v=Number(input.value);o.items[n].weight=Number.isFinite(v)&&v>0?v:'';input.value=o.items[n].weight;save();$('#line-total-'+n).textContent=money((Number(o.items[n].weight)||0)*(o.items[n].price??prod(o.items[n].product)?.price??0));$('#order-total').textContent=money(total(o))}
function startOrder(id){const o=db.orders.find(x=>x.id===id);o.status='progress';save();render();openOrder(id);toast('Zamówienie jest w realizacji')}
function completeOrder(id){const o=db.orders.find(x=>x.id===id);if(o.method==='Poczta'&&!o.paid){alertBox('Najpierw zaznacz „Zapłacone”','Przed ważeniem i zatwierdzeniem zamówienia pocztowego potwierdź płatność.');return}if(o.items.some(i=>!Number.isFinite(Number(i.weight))||Number(i.weight)<=0)){alertBox('Uzupełnij rzeczywistą wagę','Wpisz wagę większą od zera dla każdej pozycji w zamówieniu.');return}o.status='done';addOrderLabels(id,false);save();closeModal();navigate('labels');toast('Zrealizowano zamówienie. Etykiety czekają w kolejce.')}
function addOrderLabels(id,persist=true){const o=db.orders.find(x=>x.id===id);o.items.forEach(i=>db.labels.push({id:uid(),order:id,title:prod(i.product)?.name||'Produkt',text:client(o.client)?.name+' · #WM-'+o.number+'\nMasa netto: '+Number(i.weight).toFixed(3)+' kg · '+money(Number(i.weight)*(i.price??prod(i.product)?.price??0))+'\nData: '+today()+'\n'+db.settings.footer}));if(persist)save()}
function products(){ $('#main').innerHTML=heading('Produkty','Twoje wędzonki, jednostki i aktualne ceny za kilogram.','<button class="primary" onclick="editProduct()">＋ Dodaj produkt</button>')+'<div class="grid">'+db.products.map(p=>'<div class="panel product"><span class="product-icon" aria-hidden="true">◇</span><h2 style="font-size:23px;margin-bottom:9px">'+esc(p.name)+'</h2><span class="muted">Jednostki zamówienia: '+units(p).join(' / ')+'</span><div class="price">'+money(p.price)+' <small>/ kg</small></div><button onclick="editProduct(\''+p.id+'\')">Edytuj produkt</button></div>').join('')+'</div>'}
function editProduct(id){const p=id?prod(id):{id:uid(),name:'',price:0,sausage:false};showModal(modalHead(id?'Edytuj produkt':'Nowy produkt')+'<form id="product-form" class="form-grid"><label class="full">Nazwa<input id="pn" required value="'+esc(p.name)+'"></label><label>Cena za kg (zł)<input id="pp" type="number" step="0.01" min="0.01" required value="'+p.price+'"></label><label>Rodzaj<select id="ps"><option value="false" '+(!p.sausage?'selected':'')+'>Pozostałe — sztuki / kg</option><option value="true" '+(p.sausage?'selected':'')+'>Kiełbasa — pętka / kg</option></select></label><div class="modal-actions full"><button type="button" onclick="closeModal()">Anuluj</button><button class="primary">Zapisz produkt</button></div></form>');$('#product-form').onsubmit=e=>{e.preventDefault();const name=$('#pn').value.trim(),price=Number($('#pp').value);if(!name||!Number.isFinite(price)||price<=0)return;Object.assign(p,{name,price,sausage:$('#ps').value==='true'});if(!id)db.products.push(p);save();closeModal();render();toast('Produkt zapisany')}}
function clients(){const list=db.clients.filter(c=>[c.name,c.phone,c.address].join(' ').toLowerCase().includes(query.toLowerCase()));$('#main').innerHTML=heading('Klienci','Dane kontaktowe i historia zamówień w jednym miejscu.','<button class="primary" onclick="editClient()">＋ Dodaj klienta</button>')+'<div class="toolbar"><input id="client-search" placeholder="Szukaj klienta lub telefonu…" aria-label="Szukaj klienta" value="'+esc(query)+'"></div><div class="panel"><div class="table-wrap"><table><thead><tr><th>Klient</th><th>Telefon</th><th>Adres</th><th>Zamówienia</th><th></th></tr></thead><tbody>'+list.map(c=>'<tr><td><strong>'+esc(c.name)+'</strong></td><td>'+esc(c.phone)+'</td><td>'+esc(c.address)+'</td><td>'+db.orders.filter(o=>o.client===c.id).length+'</td><td><button onclick="editClient(\''+c.id+'\')">Edytuj / historia</button></td></tr>').join('')+'</tbody></table></div>'+(list.length?'':'<div class="empty">Nie znaleziono klientów.</div>')+'</div>';$('#client-search').oninput=e=>{const pos=e.target.selectionStart;query=e.target.value;clients();$('#client-search').focus();$('#client-search').setSelectionRange(pos,pos)}}
function editClient(id){const c=id?client(id):{id:uid(),name:'',phone:'',address:''};showModal(modalHead(id?'Karta klienta':'Nowy klient')+'<form id="client-form" class="form-grid"><label class="full">Imię i nazwisko<input id="cn" required value="'+esc(c.name)+'"></label><label class="full">Telefon<input id="cp" type="tel" value="'+esc(c.phone)+'"></label><label class="full">Adres dostawy<textarea id="ca" rows="3">'+esc(c.address)+'</textarea></label><div class="modal-actions full"><button type="button" onclick="closeModal()">Anuluj</button><button class="primary">Zapisz klienta</button></div></form>'+(id?'<div class="section"><h3>Historia zamówień</h3>'+rows(db.orders.filter(o=>o.client===id))+'</div>':''),true);$('#client-form').onsubmit=e=>{e.preventDefault();const name=$('#cn').value.trim();if(!name)return;Object.assign(c,{name,phone:$('#cp').value.trim(),address:$('#ca').value.trim()});if(!id)db.clients.push(c);save();closeModal();render();toast('Klient zapisany')}}
let placements=[];
function labels(){let cursor=0;placements=Array(8).fill(null).map((_,n)=>db.used[n]?null:db.labels[cursor++]||null);const assigned=placements.filter(Boolean).length;$('#main').innerHTML='<div class="print-area">'+heading('Etykiety','Arkusz A4 · 2 kolumny × 4 wiersze · 8 etykiet','<button class="primary" '+(!assigned?'disabled':'')+' onclick="printLabels()">Drukuj arkusz ↗</button>')+'<div class="label-layout"><div class="panel label-tools"><div><h3>Przygotuj kartkę</h3><p class="tip">Zaznacz pola, które zostały już zużyte. Etykiety wypełnią pozostałe miejsca od góry.</p></div><div><span class="eyebrow">Kolejka etykiet</span><h2 style="margin:10px 0">'+db.labels.length+' <small style="font:14px DM Sans">do wydruku</small></h2><p class="tip">Na tej kartce: '+assigned+'<br>Wolne pola: '+db.used.filter(u=>!u).length+'</p></div><button onclick="db.used=Array(8).fill(false);save();labels()">Nowa czysta kartka</button><button '+(!assigned?'disabled':'')+' onclick="confirmPrinted()">Potwierdź wydruk i zużycie pól</button><p class="tip">Drukuj w skali 100%, bez nagłówków i stopek. Po udanym druku potwierdź zużycie pól. Jeśli anulujesz druk, kolejka pozostaje bez zmian.</p></div><div class="sheet" id="sheet">'+placements.map((l,n)=>'<div class="label-slot '+(db.used[n]?'used':!l?'blank':'')+'"><label><input type="checkbox" aria-label="Pole '+(n+1)+' zużyte" '+(db.used[n]?'checked':'')+' onchange="db.used['+n+']=this.checked;save();labels()"> Zużyte</label>'+(db.used[n]?'<span>POLE ZUŻYTE</span>':l?'<strong contenteditable="true" role="textbox" aria-label="Nagłówek etykiety '+(n+1)+'" onblur="editLabel(\''+l.id+'\',\'title\',this.textContent)">'+esc(l.title)+'</strong><small style="color:#6f5b36">'+esc(db.settings.company)+'</small><textarea aria-label="Treść etykiety '+(n+1)+'" oninput="this.style.height=\'auto\';this.style.height=this.scrollHeight+\'px\';editLabel(\''+l.id+'\',\'text\',this.value)">'+esc(l.text)+'</textarea>':'<span style="color:#aaa;text-align:center">Wolne pole</span>')+'<span class="slot-num">'+(n+1)+'</span></div>').join('')+'</div></div><div class="bottom-note"><span>Etykiety są edytowalne — kliknij nagłówek lub treść.</span><span>Przed pierwszym użyciem sprawdź dopasowanie na zwykłej kartce A4.</span></div></div>';document.querySelectorAll('.label-slot textarea').forEach(e=>{e.style.height='auto';e.style.height=e.scrollHeight+'px'})}
function editLabel(id,k,v){const l=db.labels.find(l=>l.id===id);if(l){l[k]=v;save()}}
function printLabels(){document.activeElement?.blur();window.print()}
function confirmPrinted(){const assigned=placements.filter(Boolean);if(!assigned.length)return;showModal(modalHead('Potwierdź udany wydruk')+'<p class="tip">Oznaczysz '+assigned.length+' pól jako zużyte i usuniesz wydrukowane etykiety z kolejki. Zrób to dopiero po sprawdzeniu wydruku.</p><div class="modal-actions"><button onclick="closeModal()">Anuluj</button><button class="primary" onclick="finishPrint()">Potwierdź wydruk</button></div>')}
function finishPrint(){const ids=placements.filter(Boolean).map(l=>l.id);placements.forEach((l,n)=>{if(l)db.used[n]=true});db.labels=db.labels.filter(l=>!ids.includes(l.id));save();closeModal();labels();toast('Pola oznaczono jako zużyte')}
function settings(){$('#main').innerHTML=heading('Ustawienia','Dane pracowni, etykiety i kopia zapasowa.')+'<div class="panel" style="padding:26px;max-width:800px"><form id="settings-form" class="form-grid"><label class="full">Nazwa na etykietach<input id="sc" required value="'+esc(db.settings.company)+'"></label><label class="full">Domyślny tekst etykiety<textarea id="sf" rows="3">'+esc(db.settings.footer)+'</textarea></label><div class="full"><button class="primary">Zapisz ustawienia</button></div></form><div class="section"><h3>Kopia danych</h3><p class="tip">Dane są przechowywane lokalnie w tej przeglądarce. Nie synchronizują się między urządzeniami. Regularnie pobieraj kopię zapasową.</p><button onclick="exportData()">Pobierz kopię JSON</button></div><div class="section"><h3>O aplikacji</h3><p class="tip">Wędzone Mayo v3 · działająca wersja lokalna.<br>Ceny produktów są cenami za kilogram. Etykiety mają format 95 × 69,25 mm przy marginesach A4 po 10 mm. Dane startowe są demonstracyjne.</p></div></div>';$('#settings-form').onsubmit=e=>{e.preventDefault();db.settings.company=$('#sc').value.trim();db.settings.footer=$('#sf').value;save();toast('Ustawienia zapisane')}}
function exportData(){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='wedzone-mayo-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){const a=document.querySelector('.alert-backdrop');if(a)a.remove();else closeModal()}if(e.key==='Tab'&&$('#modal').firstChild){const nodes=[...$('#modal').querySelectorAll('button,input,select,textarea,a,[contenteditable=true]')].filter(n=>!n.disabled);const first=nodes[0],last=nodes[nodes.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus()}}});
render();
</script></body></html>
